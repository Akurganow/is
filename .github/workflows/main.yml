name: Main

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

env:
    CI: true

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Lint
              run: npm run lint

            - name: Typecheck tests
              run: npm run typecheck:tests

    test-node:
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest
                node-version:
                    - 'lts/*'
                    - 'latest'
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run jest tests
              run: npm test

    test-bun:
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest
                bun-version:
                    - '1.3.x'
                    - '1.4.x'
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ matrix.bun-version }}

            - name: Install dependencies
              run: bun install --ignore-scripts

            - name: Run bun tests
              run: bun test

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build
              run: npm run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              with:
                  name: lib
                  path: lib
                  retention-days: 30
